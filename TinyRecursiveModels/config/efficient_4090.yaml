# Efficient training config for RTX 3090/4090 (24GB VRAM)
# Uses QLoRA (4-bit) + DoRA adapters

defaults:
  - arch: trm
  - _self_

hydra:
  output_subdir: null

# Data path
data_paths: ['data/arc1concept-aug-1000']
data_paths_test: []

evaluators:
  - name: arc@ARC

# Hyperparams - Training
global_batch_size: 256  # Reduced for memory

epochs: 100000
eval_interval: 10000
checkpoint_every_eval: True

lr: 2e-4  # Higher LR for adapters
lr_min_ratio: 0.1
lr_warmup_steps: 1000

# Standard hyperparameter settings
beta1: 0.9
beta2: 0.95
weight_decay: 0.1
puzzle_emb_weight_decay: 0.1

# Hyperparams - Puzzle embeddings training
puzzle_emb_lr: 1e-2

seed: 0
min_eval_interval: 0

ema: True
ema_rate: 0.999
freeze_weights: False

# Efficient training config (custom fields)
efficient_training:
  enabled: true
  adapter:
    type: dora  # LoRA, DoRA, or none
    rank: 16
    alpha: 32
    dropout: 0.0
    use_pissa: true
    use_rslora: false
  quantization:
    enabled: true
    bits: 4
    compute_dtype: bfloat16
    use_loftq: true
  galore:
    enabled: false
    rank: 128
    update_freq: 200
    scale: 1.0
  lora_plus:
    enabled: true
    lr_A: 1e-4
    lr_B: 2e-4
